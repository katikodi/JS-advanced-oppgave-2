<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie List</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header">
        <h1>Movies</h1>
        <form id="add-movie">
            <label for="add-title">Add movie title:</label>
            <input id="add-title" name="movie-title-input" type="text" required>
            <br>
            <label for="add-url">Paste link:</label>
            <input id="add-url" name="movie-url-input" type="url" required>
            <input id="submit-btn" type="submit" value="Add movie">
        </form>
        <button id="reset-btn">Delete all</button>
        <dialog id="confirm-dialog">
            <div id="confirm-dialog-content">
                <p style="margin: 20px 0 0 0;">Are you sure you want to delete <strong>everything</strong>?</p>
                <p style="margin: 0;"><em>(this includes movies hidden by filters)</em></p>
                <div id="dialog-btns">
                    <button id="cancel-btn">No, cancel</button>
                    <button id="confirm-btn">Yes, delete it all</button>
                </div>
            </div>
        </dialog>
    </div>
    <div id="main">
        <div id="all-selections">
            <span id="sorting-span">
                <label>Sort by:</label>
                <button class="sort-btn active-sort" id="chronological">⮟ Last added</button>
                <button class="sort-btn" id="alphabetical">⮝ A-Z</button>
            </span>

            <div id="all-of-filter-visuals">
                <div id="active-filter-btns-container"></div>

                <div class="dropdown-container">
                    <button class="dropdown-btn">
                        Filter<span class="arrow">▼</span>
                    </button>
                    <ul class="dropdown-items">
                        <li id="watched" class="filter"><button><span class="dd-icon-solo">👁</span>Watched</button></li>
                        <li id="commented" class="filter"><button><span class="dd-icon-solo">🗩</span>Commented</button></li>
                        <li id="not-watched" class="filter"><button><span class="dd-icon-span">
                                <span class="dd-icon">👁</span>
                                <span class="dd-icon-slash">/</span>
                            </span>Not watched</button></li>
                        <li id="no-comment" class="filter"><button><span class="dd-icon-span">
                                <span class="dd-icon">🗩</span>
                                <span class="dd-icon-slash">/</span>
                            </span>Not commented</button></li>
                    </ul>
                </div>
            </div>
            

            <!--
            <span id="filters-span">
                <label id="filter-label">Filter:</label>
                
                <input type="checkbox" id="watched-checkbox" class="filter-checkbox">
                <select name="toggle-watched" id="toggle-watched">
                    <option value="Watched">Watched</option>
                    <option value="Not watched">Not watched</option>
                </select>

                <input type="checkbox" id="commented-checkbox" class="filter-checkbox">
                <select name="toggle-commented" id="toggle-commented">
                    <option>Commented</option>
                    <option>Not commented</option>
                </select>
            </span>
            -->
        </div>
        <div id="movie-card-container"></div>
    </div>
</body>
</html>
